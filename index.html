<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja WA</title>
    <!-- Inclusão do CSS do Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Menu Superior (Navbar) -->
    <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom">
      <div class="container-fluid">
        <!-- Marca / Título -->
        <a class="navbar-brand fw-bold" href="#">Loja WA</a>

        <!-- Botão Hamburger para ecrãs menores que 'md' -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNavegacao"
          aria-controls="menuNavegacao"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Itens do Menu -->
        <div class="collapse navbar-collapse" id="menuNavegacao">
          <!-- Alinhados à esquerda -->
          <ul class="navbar-nav me-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Início</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Gerenciar produtos</a>
            </li>
          </ul>
          <!-- Alinhado à direita -->
          <ul class="navbar-nav">
            <li class="nav-item">
              <button class="btn btn-secondary">Sair</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-5">
      <!-- Título da Listagem -->
      <div class="row mb-4">
        <div class="col-12">
          <h2 class="text-start">Produtos</h2>
        </div>
      </div>

      <!-- Grid de Produtos -->
      <!-- g-3 define o espaçamento 3 entre as colunas -->
      <div class="row g-3">
        <!-- Produto 1: Bicicleta -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm">
            <img
              src="assets/placeholder.png"
              class="card-img-top p-3"
              alt="Imagem Placeholder"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Bicicleta</h6>
              <p class="card-text text-muted mb-3">R$ 1.200,00</p>
              <button class="btn btn-primary mt-auto">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>

        <!-- Produto 2: Echo dot -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm">
            <img
              src="assets/placeholder.png"
              class="card-img-top p-3"
              alt="Imagem Placeholder"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Echo dot</h6>
              <p class="card-text text-muted mb-3">R$ 400,00</p>
              <button class="btn btn-primary mt-auto">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>

        <!-- Produto 3: Celular -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm">
            <img
              src="assets/placeholder.png"
              class="card-img-top p-3"
              alt="Imagem Placeholder"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Celular</h6>
              <p class="card-text text-muted mb-3">R$ 3.200,00</p>
              <button class="btn btn-primary mt-auto">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>

        <!-- Produto 4: Umidificador (Indisponível) -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 shadow-sm">
            <img
              src="assets/placeholder.png"
              class="card-img-top p-3"
              alt="Imagem Placeholder"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Umidificador</h6>
              <p class="card-text text-muted mb-3">R$ 150,00</p>
              <!-- Botão desabilitado com classe secondary e atributo disabled -->
              <button class="btn btn-secondary mt-auto" disabled>
                Indisponível
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Inclusão do JavaScript do Bootstrap 5 (Necessário para o menu responsivo colapsar) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
