<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja WA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #e6e8eb;
        color: #1a1a1a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .efeito-vidro {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 8px 32px 0 rgba(0, 0, 0, 0.05),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.8);
      }

      .navbar-vidro {
        border-radius: 50px;
        width: 92%;
        max-width: 900px;
        padding: 0.5rem 2rem;
        margin-top: 1.5rem;
      }

      .navbar-vidro .nav-link,
      .navbar-vidro .navbar-brand {
        color: #000 !important;
        font-weight: 500;
      }

      .conteudo-principal {
        margin-top: 120px;
      }

      .card-vidro {
        border-radius: 24px;
        overflow: hidden;
        border: 1.5px solid rgba(255, 255, 255, 0.7);
      }

      .card-vidro img {
        border-radius: 24px 24px 0 0;
        padding: 1.5rem;
        mix-blend-mode: multiply;
      }

      .btn-vidro-azul {
        background: rgba(154, 185, 226, 0.7);
        color: #000;
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        border-radius: 50px;
        box-shadow:
          0 4px 16px 0 rgba(154, 185, 226, 0.3),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.7);
        font-weight: 500;
        transition: all 0.2s;
      }

      .btn-vidro-azul:hover {
        background: rgba(154, 185, 226, 0.9);
        color: #000;
      }

      .btn-vidro-branco {
        background: rgba(255, 255, 255, 0.4);
        color: #000;
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        border-radius: 50px;
        box-shadow:
          0 4px 16px 0 rgba(0, 0, 0, 0.05),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.8);
        font-weight: 500;
      }

      .btn-vidro-branco:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-md fixed-top mx-auto efeito-vidro navbar-vidro"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Loja WA</a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNavegacao"
          aria-controls="menuNavegacao"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavegacao">
          <ul class="navbar-nav me-auto mb-2 mb-md-0 mx-auto">
            <li class="nav-item">
              <a class="nav-link px-3" aria-current="page" href="index.html"
                >Início</a
              >
            </li>
            <li class="nav-item border-start border-light border-opacity-50">
              <a class="nav-link px-3" href="produtos.html"
                >Gerenciar produtos</a
              >
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <!-- Botão transformado em link apontando para login.html -->
              <a
                href="login.html"
                class="btn btn-vidro-branco text-decoration-none"
                >Sair</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container conteudo-principal mb-5">
      <div class="row mb-4">
        <div class="col-12">
          <h2 class="text-start fw-bold" style="letter-spacing: -0.5px">
            Produtos
          </h2>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 efeito-vidro card-vidro">
            <img
              src="assets/placeholder-image.png"
              class="card-img-top"
              alt="Bicicleta"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Bicicleta</h6>
              <p class="card-text text-muted mb-4">R$ 1.200,00</p>
              <button class="btn btn-vidro-azul mt-auto w-100">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 efeito-vidro card-vidro">
            <img
              src="assets/placeholder-image.png"
              class="card-img-top"
              alt="Echo dot"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Echo dot</h6>
              <p class="card-text text-muted mb-4">R$ 400,00</p>
              <button class="btn btn-vidro-azul mt-auto w-100">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 efeito-vidro card-vidro">
            <img
              src="assets/placeholder-image.png"
              class="card-img-top"
              alt="Celular"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Celular</h6>
              <p class="card-text text-muted mb-4">R$ 3.200,00</p>
              <button class="btn btn-vidro-azul mt-auto w-100">
                Adicionar ao carrinho
              </button>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
          <div class="card h-100 efeito-vidro card-vidro">
            <img
              src="assets/placeholder-image.png"
              class="card-img-top"
              alt="Umidificador"
            />
            <div class="card-body d-flex flex-column">
              <h6 class="card-title fw-bold">Umidificador</h6>
              <p class="card-text text-muted mb-4">R$ 150,00</p>
              <button class="btn btn-vidro-branco mt-auto w-100" disabled>
                Indisponível
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
