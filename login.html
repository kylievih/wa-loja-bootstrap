<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #e6e8eb;
        color: #1a1a1a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .efeito-vidro {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 8px 32px 0 rgba(0, 0, 0, 0.05),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        padding: 2.5rem;
      }

      .input-vidro {
        background: transparent;
        border: none;
        border-bottom: 1.5px solid rgba(0, 0, 0, 0.2);
        border-radius: 0;
        padding-left: 0;
        box-shadow: none !important;
        transition: border-color 0.3s;
      }

      .input-vidro:focus {
        background: transparent;
        border-bottom: 1.5px solid #9ab9e2;
      }

      .btn-vidro-azul {
        background: rgba(154, 185, 226, 0.7);
        color: #000;
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        border-radius: 50px;
        box-shadow:
          0 4px 16px 0 rgba(154, 185, 226, 0.3),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.7);
        font-weight: 500;
        transition: all 0.2s;
      }

      .btn-vidro-azul:hover {
        background: rgba(154, 185, 226, 0.9);
        color: #000;
      }

      .coluna-boas-vindas {
        background: linear-gradient(
          135deg,
          rgba(154, 185, 226, 0.15) 0%,
          rgba(255, 255, 255, 0) 100%
        );
      }
    </style>
  </head>
  <body>
    <div class="row g-0 vh-100">
      <div
        class="col-12 col-md-4 coluna-boas-vindas d-flex justify-content-center align-items-center p-5"
      >
        <h3 class="text-center fw-bold" style="letter-spacing: -0.5px">
          Bem-vindo à WA Loja!
        </h3>
      </div>

      <div
        class="col-12 col-md-8 d-flex justify-content-center align-items-center p-5"
      >
        <div class="w-100 efeito-vidro" style="max-width: 450px">
          <h4 class="mb-4 fw-bold text-center">Login</h4>

          <form action="index.html">
            <div class="mb-3">
              <label
                for="emailLogin"
                class="form-label text-muted small fw-bold"
                >Email</label
              >
              <input
                type="email"
                class="form-control input-vidro"
                id="emailLogin"
                required
              />
            </div>
            <div class="mb-4">
              <label
                for="senhaLogin"
                class="form-label text-muted small fw-bold"
                >Senha</label
              >
              <input
                type="password"
                class="form-control input-vidro"
                id="senhaLogin"
                required
              />
            </div>

            <div class="d-grid gap-2 text-center mt-4">
              <button type="submit" class="btn btn-vidro-azul py-2">
                Entrar
              </button>
              <a
                href="cadastro.html"
                class="text-secondary text-decoration-none mt-3 small fw-bold"
                >Não tenho cadastro</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
