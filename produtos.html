<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA - Gerenciar Produtos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #e6e8eb;
        color: #1a1a1a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .efeito-vidro {
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 8px 32px 0 rgba(0, 0, 0, 0.05),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.8);
        border-radius: 24px;
      }

      .navbar-vidro {
        border-radius: 50px;
        width: 92%;
        max-width: 900px;
        padding: 0.5rem 2rem;
        margin-top: 1.5rem;
      }

      .navbar-vidro .nav-link,
      .navbar-vidro .navbar-brand {
        color: #000 !important;
        font-weight: 500;
      }

      .conteudo-principal {
        margin-top: 120px;
      }

      .btn-vidro-azul {
        background: rgba(154, 185, 226, 0.7);
        color: #000;
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        border-radius: 50px;
        box-shadow:
          0 4px 16px 0 rgba(154, 185, 226, 0.3),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.7);
        font-weight: 500;
        transition: all 0.2s;
      }
      .btn-vidro-azul:hover {
        background: rgba(154, 185, 226, 0.9);
        color: #000;
      }

      .btn-vidro-branco {
        background: rgba(255, 255, 255, 0.4);
        color: #000;
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        border-radius: 50px;
        box-shadow:
          0 4px 16px 0 rgba(0, 0, 0, 0.05),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.8);
        font-weight: 500;
        transition: all 0.2s;
      }
      .btn-vidro-branco:hover {
        background: rgba(255, 255, 255, 0.7);
      }

      .input-vidro {
        background: transparent;
        border: none;
        border-bottom: 1.5px solid rgba(0, 0, 0, 0.2);
        border-radius: 0;
        padding-left: 0;
        box-shadow: none !important;
        transition: border-color 0.3s;
      }
      .input-vidro:focus {
        border-bottom: 1.5px solid #9ab9e2;
        background: transparent;
      }

      .table-vidro {
        --bs-table-bg: transparent;
        --bs-table-striped-bg: rgba(255, 255, 255, 0.2);
        --bs-table-hover-bg: rgba(255, 255, 255, 0.3);
        color: #1a1a1a;
        margin-bottom: 0;
      }
      .table-vidro th {
        border-bottom-color: rgba(0, 0, 0, 0.1);
      }
      .table-vidro td {
        border-bottom-color: rgba(0, 0, 0, 0.05);
      }

      .modal-content.efeito-vidro {
        background: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-md fixed-top mx-auto efeito-vidro navbar-vidro"
    >
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Loja WA</a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuNavegacao"
          aria-controls="menuNavegacao"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNavegacao">
          <ul class="navbar-nav me-auto mb-2 mb-md-0 mx-auto">
            <li class="nav-item">
              <a class="nav-link px-3" href="index.html">Início</a>
            </li>
            <li class="nav-item border-start border-light border-opacity-50">
              <a class="nav-link px-3" aria-current="page" href="produtos.html"
                >Gerenciar produtos</a
              >
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                href="login.html"
                class="btn btn-vidro-branco text-decoration-none"
                >Sair</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mb-5 conteudo-principal">
      <div class="efeito-vidro p-4 p-md-5">
        <!-- Cabeçalho com Título e Botão -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="mb-0 fw-bold" style="letter-spacing: -0.5px">
            Gerenciar Produtos
          </h2>
          <button
            type="button"
            class="btn btn-vidro-azul px-4"
            data-bs-toggle="modal"
            data-bs-target="#modalNovoProduto"
          >
            Novo Produto
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-striped align-middle table-vidro">
            <thead>
              <tr>
                <th scope="col">id</th>
                <th scope="col">Produto</th>
                <th scope="col">Preço</th>
                <th scope="col">Estoque</th>
                <th scope="col" class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="fw-bold text-muted">1</td>
                <td class="fw-bold">Bicicleta</td>
                <td>R$ 1.000,00</td>
                <td>110</td>
                <td class="text-center">
                  <button class="btn btn-vidro-branco btn-sm px-3 me-1">
                    Editar
                  </button>
                  <button class="btn btn-vidro-branco btn-sm px-3">
                    Excluir
                  </button>
                </td>
              </tr>
              <tr>
                <td class="fw-bold text-muted">2</td>
                <td class="fw-bold">Echo dot</td>
                <td>R$ 600,00</td>
                <td>15</td>
                <td class="text-center">
                  <button class="btn btn-vidro-branco btn-sm px-3 me-1">
                    Editar
                  </button>
                  <button class="btn btn-vidro-branco btn-sm px-3">
                    Excluir
                  </button>
                </td>
              </tr>
              <tr>
                <td class="fw-bold text-muted">3</td>
                <td class="fw-bold">Celular</td>
                <td>R$ 1.500,00</td>
                <td>10</td>
                <td class="text-center">
                  <button class="btn btn-vidro-branco btn-sm px-3 me-1">
                    Editar
                  </button>
                  <button class="btn btn-vidro-branco btn-sm px-3">
                    Excluir
                  </button>
                </td>
              </tr>
              <tr>
                <td class="fw-bold text-muted">4</td>
                <td class="fw-bold">Umidificador</td>
                <td>R$ 100,00</td>
                <td class="text-danger fw-bold">0</td>
                <td class="text-center">
                  <button class="btn btn-vidro-branco btn-sm px-3 me-1">
                    Editar
                  </button>
                  <button class="btn btn-vidro-branco btn-sm px-3">
                    Excluir
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modalNovoProduto"
      tabindex="-1"
      aria-labelledby="modalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content efeito-vidro border-0">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold" id="modalLabel">Novo Produto</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body pt-4">
            <form action="#">
              <div class="mb-3">
                <label
                  for="nomeProduto"
                  class="form-label text-muted small fw-bold"
                  >Produto</label
                >
                <input
                  type="text"
                  class="form-control input-vidro"
                  id="nomeProduto"
                  required
                />
              </div>
              <div class="mb-3">
                <label
                  for="precoProduto"
                  class="form-label text-muted small fw-bold"
                  >Preço</label
                >
                <input
                  type="number"
                  step="0.01"
                  class="form-control input-vidro"
                  id="precoProduto"
                  required
                />
              </div>
              <div class="mb-4">
                <label
                  for="estoqueProduto"
                  class="form-label text-muted small fw-bold"
                  >Estoque</label
                >
                <input
                  type="number"
                  class="form-control input-vidro"
                  id="estoqueProduto"
                  required
                />
              </div>
              <div class="text-center mt-4 mb-2">
                <button type="submit" class="btn btn-vidro-azul w-100 py-2">
                  Confirmar cadastro
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
